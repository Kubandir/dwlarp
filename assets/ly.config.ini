# ly greeter - tokyonight / rose pine flavored
# managed from ~/important/config/ly/, symlinked to /etc/ly/config.ini

# No animation - fire was full-screen and heavy
animation = none

# Clock in top-right, strftime format
clock = %a %b %d | %H:%M

# Big ASCII clock above the login box
bigclock = true

# Password mask character
asterisk = *

# Keep password visible on failed auth
clear_password = false

# vi keybindings off - they swallow keystrokes until you press `i` and break auth
vi_mode = false

# Colors: ly palette slots 0-8. 6 = magenta (rose pine iris accent)
bg = 1
fg = 8
border_fg = 3

# Main box chrome
box_title = hoks
initial_info_text = who are you...
blank_box = true
hide_borders = false
margin_box_h = 2
margin_box_v = 1

# Input sizing
input_len = 34
max_desktop_len = 100
max_login_len = 255
max_password_len = 255

# Jump straight to password (login is remembered via save)
default_input = password
load = true
save = true
save_file = /etc/ly/save

# Power key hints + sleep wired to loginctl suspend
hide_key_hints = false
shutdown_key = F1
restart_key = F2
sleep_key = F3
shutdown_cmd = /sbin/poweroff
restart_cmd = /sbin/reboot
sleep_cmd = /usr/bin/loginctl suspend

# Locale / tty
lang = en
tty = 1
console_dev = /dev/console
path = /sbin:/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin

# Responsiveness
min_refresh_delta = 5
numlock = false

# PAM + session plumbing (leave defaults)
service_name = ly
term_reset_cmd = /usr/bin/tput reset
term_restore_cursor_cmd = /usr/bin/tput cnorm
mcookie_cmd = /usr/bin/mcookie
wayland_cmd = /etc/ly/wsetup.sh
waylandsessions = /usr/share/wayland-sessions
xinitrc = ~/.xinitrc
x_cmd = /usr/bin/X
x_cmd_setup = /etc/ly/xsetup.sh
xauth_cmd = /usr/bin/xauth
xsessions = /usr/share/xsessions
