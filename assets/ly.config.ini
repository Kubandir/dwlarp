# ly greeter — dwlarp default theme.
# Black bg, white text, green accents, empty box (no fill).

animation = none
clock = %a %b %d | %H:%M
bigclock = true
asterisk = *
clear_password = false
vi_mode = false

# Colors (ly palette 0-8): 1=BLACK 8=WHITE 3=GREEN
bg = 1
fg = 8
border_fg = 3

box_title = null
initial_info_text = null
blank_box = true
hide_borders = false
margin_box_h = 2
margin_box_v = 1
input_len = 34
max_desktop_len = 100
max_login_len = 255
max_password_len = 255
default_input = password

# Persist last username + session and autofill on next boot.
load = true
save = true
save_file = /etc/ly/save

hide_key_hints = false
shutdown_key = F1
restart_key = F2
sleep_key = F3
shutdown_cmd = /sbin/poweroff
restart_cmd = /sbin/reboot
sleep_cmd = /usr/bin/loginctl suspend
lang = en
tty = 1
console_dev = /dev/console
path = /sbin:/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin
min_refresh_delta = 5
numlock = false
service_name = ly
term_reset_cmd = /usr/bin/tput reset
term_restore_cursor_cmd = /usr/bin/tput cnorm
mcookie_cmd = /usr/bin/mcookie
wayland_cmd = /etc/ly/wsetup.sh
waylandsessions = /usr/share/wayland-sessions
xinitrc = ~/.xinitrc
x_cmd = /usr/bin/X
x_cmd_setup = /etc/ly/xsetup.sh
xauth_cmd = /usr/bin/xauth
xsessions = /usr/share/xsessions
