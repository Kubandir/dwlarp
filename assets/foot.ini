font=FiraCode Nerd Font:style=SemiBold:size=10
font-bold=FiraCode Nerd Font:style=Bold:size=10
dpi-aware=no
pad=8x6 center
term=xterm-256color
selection-target=clipboard
bold-text-in-bright=no

[scrollback]
lines=10000
multiplier=3.0
indicator-position=relative
indicator-format=line

[cursor]
style=beam
blink=yes

[mouse]
hide-when-typing=yes

[url]
launch=xdg-open ${url}
label-letters=sadfjklewcmpgh
osc8-underline=always
protocols=http, https, ftp, ftps, file, gemini, gopher
uri-characters=abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-._~:/?#@!$&%*+,;=()[]

[colors-dark]
alpha=0.7
background=000000
foreground=e6e8ee
selection-foreground=0d1418
selection-background=c8b8e8

regular0=3a3a4a
regular1=f5a8b0
regular2=a8e6b8
regular3=f5d9a8
regular4=a8c8f0
regular5=d9b0f0
regular6=a8e6e0
regular7=d8dce4

bright0=5c5c70
bright1=ffc4cc
bright2=c4f0d0
bright3=ffe6c4
bright4=c4dcff
bright5=eccaff
bright6=c4f0ec
bright7=f0f4fa

[key-bindings]
scrollback-up-page=Shift+Page_Up
scrollback-down-page=Shift+Page_Down
scrollback-up-line=Shift+Up
scrollback-down-line=Shift+Down
clipboard-copy=Control+Shift+c XF86Copy
clipboard-paste=Control+Shift+v XF86Paste
show-urls-launch=Control+Shift+u
show-urls-copy=Control+Shift+y
